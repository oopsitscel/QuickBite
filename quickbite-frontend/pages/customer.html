<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>QuickBite Customer</title>

  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/customer.css"/>
</head>

<body>
  <div class="navbar">
    <h1>QuickBite</h1>

    <button id="logoutBtn">
      Logout
    </button>
  </div>

  <div class="container">
    <div class="menu-section">
      <h2 class="section-title">
        Food Menu
      </h2>

      <div id="menuContainer" class="menu-grid">
        
      </div>

    </div>

    <div class="cart-section">
      <h2>
        Your Cart
      </h2>

      <div id="cartItems"> 
        Your cart is empty.
      </div>

      <div class="cart-footer">
        <h3>
          Total:
          <span id="cartTotal">
            Rp 0
          </span>
        </h3>

        <button class="gradient-btn" id="checkoutBtn">
          Checkout
        </button>
      </div>

  </div>

  </div>

  <script src="../js/api.js"></script>

  <script src="../js/customer.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QuickBite Customer</title>

  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/widget/navbar.css">
  <link rel="stylesheet" href="../css/widget/categories.css">
  <link rel="stylesheet" href="../css/widget/menu.css"/>
  <link rel="stylesheet" href="../css/widget/cart.css"/>
  <link rel="stylesheet" href="../css/widget/orders.css"/>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <h1>
        QuickBite
      </h1>

      <div class="nav-links">
        <button id="menuNav" class="active">
          Menu
        </button>

        <button id="ordersNav">
          My Orders
        </button>
      </div>
    </div>

    <button id="logoutBtn" class ="logout-btn">
      Logout
    </button>
    
  </nav>

  <!-- Main Content -->
  <div class="container">  
    <!-- Menu Section -->
    <section id="menuSection" class="menu-section">
      <div class="section-header">
        <h1>
          Welcome to QuickBite, <span id="userName"></span>!
        </h1>

        <p>
          Browse our delicious menu and place your order now.
        </p>
      </div>

      <!-- CATEGORY -->
      <div id="categoryHeader" class="category-header">
        <h2 id="categoryTitle">
            All Menu
        </h2>

        <p id="categoryDescription">
            Browse all available food and drinks.
        </p>
      </div>

      <div id="categoryContainer" class="category-list">
        <!-- Category Name will be dynamically inserted here -->>
      </div>

      <div id="menuContainer" class="menu-grid">
        <!-- Menu items will be dynamically inserted here -->
      </div>
    </section>

    <!-- Cart Section -->
    <aside class="cart-section">
      <h2 class="section-title">
        Your Cart
      </h2>

      <div id="cartItems"> 
        Cart is empty.
      </div>

      <div class="cart-footer">
        <div class="total-row">
          <span>
            Total:
          </span>

          <span id="cartTotal">
            Rp 0
          </span>
        </div>

        <button class="gradient-btn" id="checkoutBtn">
          Checkout
        </button>
      </div>

    </aside>
  </div>

  <!-- ORDERS SECTION --> 
  <section id="ordersSection" class="orders-page">

    <div class="orders-header"> 
      <p class="section-header">
        ORDER HISTORY 
      </p> 
      
      <h1 class="section-title">
        My Orders 
      </h1> 
    </div> 
    
    <div id="ordersContainer">
      <!-- Orders will be dynamically inserted here -->
    </div> 
  </section>

  <script src="../js/api.js"></script>
  <script src="../js/customer.js"></script>

</body>
</html>
